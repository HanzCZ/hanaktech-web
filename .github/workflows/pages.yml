# Automatické nasazení webu na GitHub Pages.
# Spustí se při každém pushi do větve main; nasadí obsah repozitáře tak, jak je.
name: Nasazení webu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v7
      - name: Nastavit Pages
        uses: actions/configure-pages@v6
      - name: Nahrát web
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Nasadit
        id: deployment
        uses: actions/deploy-pages@v5
